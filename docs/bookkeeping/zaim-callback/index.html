<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaim 連携 - スタンプ家計簿</title>
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
            background: #0a0a1a;
            color: #e8e8f0;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }
        a { color: #7fd4ff; }
    </style>
</head>
<body>
    <!--
      Zaim の OAuth コールバックはアプリ登録時の Service URL (https://normidar.com) 配下にしか
      戻せないため、このページで受けて oauth_token / oauth_verifier をそのままアプリの
      カスタムスキームへ渡す。アプリ側: apps/bookkeeping/lib/src/logic/zaim/zaim_config.dart
    -->
    <main>
        <p>アプリに戻っています…<br>Returning to the app…</p>
        <p><a id="open" href="#">アプリを開く / Open the app</a></p>
    </main>
    <script>
        var target = 'com.normidar.bookkeeping://zaim-callback' + window.location.search;
        document.getElementById('open').href = target;
        window.location.replace(target);
    </script>
</body>
</html>
